name: build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore AppSweep.WinUI3.csproj

      - name: Build
        run: dotnet build AppSweep.WinUI3.csproj -c Release --no-restore

      - name: Publish
        run: dotnet publish AppSweep.WinUI3.csproj -c Release -r win-x64 -o artifacts/publish --self-contained true --no-restore

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AppSweep-wpf
          path: artifacts/publish
